<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1200px;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 3em;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .search-box input {
      padding: 12px 20px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      width: 300px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .search-box button {
      padding: 12px 30px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .search-box button:hover {
      background: #ff5252;
      transform: translateY(-2px);
    }

    .weather-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .weather-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .weather-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
    }

    .location-name {
      font-size: 24px;
      font-weight: bold;
      color: #333;
      margin-bottom: 10px;
    }

    .weather-main {
      display: flex;
      align-items: center;
      gap: 20px;
      margin: 20px 0;
    }

    .temp {
      font-size: 60px;
      font-weight: bold;
      color: #667eea;
    }

    .weather-icon {
      width: 80px;
      height: 80px;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.1));
    }

    .weather-description {
      font-size: 18px;
      color: #666;
      text-transform: capitalize;
    }

    .weather-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }

    .detail-item {
      display: flex;
      flex-direction: column;
    }

    .detail-label {
      font-size: 12px;
      color: #999;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .detail-value {
      font-size: 18px;
      font-weight: bold;
      color: #333;
    }

    .forecast {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      margin-top: 20px;
    }

    .forecast-title {
      font-size: 20px;
      font-weight: bold;
      color: #333;
      margin-bottom: 20px;
    }

    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 15px;
    }

    .forecast-item {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 15px;
      padding: 15px;
      text-align: center;
      color: white;
    }

    .forecast-day {
      font-size: 14px;
      margin-bottom: 10px;
      opacity: 0.9;
    }

    .forecast-icon {
      width: 50px;
      height: 50px;
      margin: 10px auto;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
    }

    .forecast-temp {
      font-size: 16px;
      font-weight: bold;
    }

    .error-message {
      background: #ff6b6b;
      color: white;
      padding: 15px 20px;
      border-radius: 10px;
      margin-top: 20px;
      text-align: center;
    }

    .loading {
      text-align: center;
      color: white;
      font-size: 18px;
      margin-top: 40px;
    }

    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .favorites {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 20px;
      margin-top: 20px;
    }

    .favorites-title {
      font-size: 18px;
      font-weight: bold;
      color: #333;
      margin-bottom: 15px;
    }

    .favorites-list {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .favorite-btn {
      background: #667eea;
      color: white;
      padding: 8px 15px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .favorite-btn:hover {
      background: #764ba2;
      transform: translateY(-2px);
    }

    .favorite-btn.added {
      background: #51cf66;
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 2em;
      }

      .search-box input {
        width: 100%;
      }

      .weather-grid {
        grid-template-columns: 1fr;
      }

      .forecast-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .temp {
        font-size: 48px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🌤️ Weather Dashboard</h1>
      <p>Get real-time weather updates for any city worldwide</p>
    </div>

    <div class="search-box">
      <input 
        type="text" 
        id="cityInput" 
        placeholder="Enter city name..." 
        autocomplete="off"
      >
      <button onclick="searchWeather()">Search</button>
      <button onclick="getLocationWeather()" style="background: #4ecdc4;">📍 My Location</button>
    </div>

    <div class="favorites">
      <div class="favorites-title">Quick Access</div>
      <div class="favorites-list" id="favoritesList"></div>
    </div>

    <div id="weatherContainer"></div>
  </div>

  <script>
    const API_KEY = '7c7a12e59f0e460f73e33308202312'; // Using free WeatherAPI.com
    const API_URL = 'https://api.weatherapi.com/v1';

    let favorites = JSON.parse(localStorage.getItem('weatherFavorites')) || [];

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      renderFavorites();
      searchWeather('New York');
      
      document.getElementById('cityInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') searchWeather();
      });
    });

    async function searchWeather(city = null) {
      const cityName = city || document.getElementById('cityInput').value.trim();
      
      if (!cityName) {
        showError('Please enter a city name');
        return;
      }

      showLoading();

      try {
        const response = await fetch(
          `${API_URL}/forecast.json?key=${API_KEY}&q=${cityName}&days=5&aqi=no`
        );

        if (!response.ok) {
          throw new Error('City not found');
        }

        const data = await response.json();
        displayWeather(data);
        document.getElementById('cityInput').value = '';
      } catch (error) {
        showError(error.message);
      }
    }

    function getLocationWeather() {
      if (!navigator.geolocation) {
        showError('Geolocation is not supported by your browser');
        return;
      }

      showLoading();

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const { latitude, longitude } = position.coords;
          fetchWeatherByCoords(latitude, longitude);
        },
        (error) => {
          showError('Unable to get your location');
        }
      );
    }

    async function fetchWeatherByCoords(lat, lon) {
      try {
        const response = await fetch(
          `${API_URL}/forecast.json?key=${API_KEY}&q=${lat},${lon}&days=5&aqi=no`
        );

        if (!response.ok) {
          throw new Error('Could not fetch weather data');
        }

        const data = await response.json();
        displayWeather(data);
      } catch (error) {
        showError(error.message);
      }
    }

    function displayWeather(data) {
      const { current, forecast, location } = data;
      const container = document.getElementById('weatherContainer');

      const currentDate = new Date().toLocaleDateString('en-US', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });

      let html = `
        <div class="weather-grid">
          <div class="weather-card">
            <div class="location-name">
              ${location.name}, ${location.country}
            </div>
            <div style="color: #999; font-size: 14px; margin-bottom: 10px;">${currentDate}</div>
            
            <div class="weather-main">
              <div>
                <div class="temp">${Math.round(current.temp_c)}°C</div>
                <div class="weather-description">${current.condition.text}</div>
              </div>
              <img src="https:${current.condition.icon}" alt="Weather Icon" class="weather-icon">
            </div>

            <div class="weather-details">
              <div class="detail-item">
                <div class="detail-label">Feels Like</div>
                <div class="detail-value">${Math.round(current.feelslike_c)}°C</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">Humidity</div>
                <div class="detail-value">${current.humidity}%</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">Wind Speed</div>
                <div class="detail-value">${Math.round(current.wind_kph)} km/h</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">Pressure</div>
                <div class="detail-value">${current.pressure_mb} mb</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">UV Index</div>
                <div class="detail-value">${current.uv}</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">Visibility</div>
                <div class="detail-value">${current.vis_km} km</div>
              </div>
            </div>

            <button 
              class="favorite-btn ${isFavorite(location.name) ? 'added' : ''}" 
              onclick="toggleFavorite('${location.name}')"
              style="width: 100%; margin-top: 20px;"
            >
              ${isFavorite(location.name) ? '⭐ Added to Favorites' : '☆ Add to Favorites'}
            </button>
          </div>
        </div>

        <div class="forecast">
          <div class="forecast-title">5-Day Forecast</div>
          <div class="forecast-grid">
      `;

      forecast.forecastday.forEach(day => {
        const date = new Date(day.date).toLocaleDateString('en-US', { 
          weekday: 'short', 
          month: 'short', 
          day: 'numeric' 
        });

        html += `
          <div class="forecast-item">
            <div class="forecast-day">${date}</div>
            <img src="https:${day.day.condition.icon}" alt="Weather" class="forecast-icon">
            <div class="forecast-temp">
              ${Math.round(day.day.maxtemp_c)}° / ${Math.round(day.day.mintemp_c)}°
            </div>
            <div style="font-size: 12px; margin-top: 8px; opacity: 0.8;">
              ${day.day.condition.text}
            </div>
          </div>
        `;
      });

      html += `
          </div>
        </div>
      `;

      container.innerHTML = html;
    }

    function toggleFavorite(city) {
      const index = favorites.indexOf(city);
      if (index > -1) {
        favorites.splice(index, 1);
      } else {
        favorites.push(city);
      }
      localStorage.setItem('weatherFavorites', JSON.stringify(favorites));
      renderFavorites();
      // Re-render weather to update button state
      const container = document.getElementById('weatherContainer');
      if (container.innerHTML) {
        const buttons = container.querySelectorAll('.favorite-btn');
        buttons.forEach(btn => {
          const cityMatch = document.querySelector('.location-name');
          if (cityMatch && isFavorite(cityMatch.textContent.split(',')[0])) {
            btn.classList.add('added');
            btn.textContent = '⭐ Added to Favorites';
          } else {
            btn.classList.remove('added');
            btn.textContent = '☆ Add to Favorites';
          }
        });
      }
    }

    function isFavorite(city) {
      return favorites.includes(city);
    }

    function renderFavorites() {
      const list = document.getElementById('favoritesList');
      list.innerHTML = '';

      favorites.forEach(city => {
        const btn = document.createElement('button');
        btn.className = 'favorite-btn added';
        btn.textContent = `${city}`;
        btn.onclick = () => {
          document.getElementById('cityInput').value = city;
          searchWeather(city);
        };
        list.appendChild(btn);
      });
    }

    function showLoading() {
      document.getElementById('weatherContainer').innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          Loading weather data...
        </div>
      `;
    }

    function showError(message) {
      document.getElementById('weatherContainer').innerHTML = `
        <div class="error-message">
          ⚠️ ${message}
        </div>
      `;
    }
  </script>
</body>
</html>
